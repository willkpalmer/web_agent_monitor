<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1;
    --bg-glow: #ece9df;
    --surface: #ffffff;
    --surface-hover: #fbfaf7;
    --border: #e4e1d8;
    --text: #1f1e1b;
    --muted: #6d6a62;
    --faint: #9a968c;
    --attention: #d9822b;
    --attention-soft: #fbeedd;
    --running: #2f9e6e;
    --running-soft: #ddf2e8;
    --dormant: #8a8780;
    --dormant-soft: #eeede8;
    --error: #d1453b;
    --accent: #c96442;
    --shadow: 0 1px 2px rgba(30,25,15,.05), 0 4px 16px rgba(30,25,15,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141412;
      --bg-glow: #1d1c19;
      --surface: #1e1d1a;
      --surface-hover: #252420;
      --border: #2f2e2a;
      --text: #eeece6;
      --muted: #a29e94;
      --faint: #75726a;
      --attention: #f0a04b;
      --attention-soft: #3a2a17;
      --running: #4cc38a;
      --running-soft: #173226;
      --dormant: #8f8c84;
      --dormant-soft: #282723;
      --error: #f0675c;
      --accent: #e0805e;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141412;
    --bg-glow: #1d1c19;
    --surface: #1e1d1a;
    --surface-hover: #252420;
    --border: #2f2e2a;
    --text: #eeece6;
    --muted: #a29e94;
    --faint: #75726a;
    --attention: #f0a04b;
    --attention-soft: #3a2a17;
    --running: #4cc38a;
    --running-soft: #173226;
    --dormant: #8f8c84;
    --dormant-soft: #282723;
    --error: #f0675c;
    --accent: #e0805e;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 10% -10%, var(--bg-glow), transparent 60%), var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 16px 64px; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 0; display: flex; align-items: center; gap: 10px; }
  h1 .logo { width: 28px; height: 28px; color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .search {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 14px; width: 200px; max-width: 100%;
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--surface-hover); }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px;
    box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left;
    font: inherit; color: inherit;
  }
  .stat:hover { background: var(--surface-hover); }
  .stat .num { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat .lbl { font-size: 13px; color: var(--muted); }
  .ring { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .ring.attention { background: var(--attention-soft); color: var(--attention); }
  .ring.running { background: var(--running-soft); color: var(--running); }
  .ring.dormant { background: var(--dormant-soft); color: var(--dormant); }
  .ring svg { width: 20px; height: 20px; }

  section { margin-bottom: 32px; scroll-margin-top: 16px; }
  section h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    font-weight: 600; margin: 0 0 12px; display: flex; align-items: center; gap: 8px;
  }
  section h2 .count { background: var(--dormant-soft); color: var(--muted); border-radius: 999px; padding: 0 8px; font-size: 12px; letter-spacing: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .empty { color: var(--faint); font-size: 14px; padding: 18px; border: 1px dashed var(--border); border-radius: 14px; text-align: center; }

  .card {
    position: relative; display: flex; flex-direction: column; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px 14px 20px;
    box-shadow: var(--shadow); text-decoration: none; color: inherit; overflow: hidden;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
  .card:hover { transform: translateY(-2px); background: var(--surface-hover); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.attention { --c: var(--attention); --cs: var(--attention-soft); }
  .card.running { --c: var(--running); --cs: var(--running-soft); }
  .card.dormant { --c: var(--dormant); --cs: var(--dormant-soft); }
  .card.failed { --c: var(--error); }
  .card.archived { opacity: .6; }

  .top { display: flex; align-items: flex-start; gap: 10px; }
  .title { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .open { color: var(--faint); flex: none; width: 16px; height: 16px; margin-top: 3px; transition: color .15s; }
  .card:hover .open { color: var(--accent); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500;
    color: var(--c); background: var(--cs); border-radius: 999px; padding: 2px 9px; align-self: flex-start;
  }
  .card.failed .pill { color: var(--error); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .running .dot { animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 60%, transparent); }
    100% { box-shadow: 0 0 0 7px transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .running .dot { animation: none; } .card { transition: none; } }
  .note { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .note.ask { color: var(--text); }
  .note.ask::before { content: "Needs you: "; font-weight: 600; color: var(--attention); }
  .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--faint); margin-top: auto; }
  .meta span { display: inline-flex; align-items: center; gap: 4px; }
  .meta svg { width: 13px; height: 13px; }
  .unread { position: absolute; top: 12px; right: 36px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  .banner {
    border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 10px 14px;
    font-size: 13px; color: var(--muted); margin-bottom: 20px; display: none;
  }
  .banner.show { display: block; }
  .banner.err { color: var(--error); }
  footer { color: var(--faint); font-size: 12px; text-align: center; margin-top: 40px; }

  @media (max-width: 640px) {
    .wrap { padding-top: 20px; }
    .summary { gap: 8px; }
    .stat { padding: 10px; flex-direction: column; align-items: flex-start; gap: 8px; }
    .stat .ring { width: 30px; height: 30px; }
    .stat .ring svg { width: 16px; height: 16px; }
    .stat .num { font-size: 22px; }
    .stat .lbl { font-size: 12px; }
    .grid { grid-template-columns: 1fr; }
    .search { flex: 1; width: auto; min-width: 0; }
    .controls { width: 100%; flex-wrap: nowrap; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>
        <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>
        </svg>
        Agent Monitor
      </h1>
      <div class="sub" id="updated">Loading…</div>
    </div>
    <div class="controls">
      <input class="search" id="q" type="search" placeholder="Filter sessions…" aria-label="Filter sessions">
      <button class="btn" id="archived" aria-pressed="false" title="Show archived sessions">Archived</button>
      <button class="btn" id="theme" title="Toggle theme" aria-label="Toggle theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
    </div>
  </header>

  <div class="banner" id="banner"></div>

  <div class="summary">
    <button class="stat" data-jump="attention"><div class="ring attention"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg></div><div><div class="num" id="n-attention">–</div><div class="lbl">Need attention</div></div></button>
    <button class="stat" data-jump="running"><div class="ring running"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></div><div><div class="num" id="n-running">–</div><div class="lbl">Running</div></div></button>
    <button class="stat" data-jump="dormant"><div class="ring dormant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></div><div><div class="num" id="n-dormant">–</div><div class="lbl">Dormant</div></div></button>
  </div>

  <section id="attention"><h2>Needs attention <span class="count" id="c-attention">0</span></h2><div class="grid" id="g-attention"></div></section>
  <section id="running"><h2>Running <span class="count" id="c-running">0</span></h2><div class="grid" id="g-running"></div></section>
  <section id="dormant"><h2>Dormant <span class="count" id="c-dormant">0</span></h2><div class="grid" id="g-dormant"></div></section>

  <footer>Click a session to open it in Claude. It uses your existing claude.ai sign-in.</footer>
</div>

<script>
(() => {
  const DATA_URL = "sessions.json";
  const SAMPLE_URL = "sessions.sample.json";
  const SESSION_URL = id => `https://claude.ai/code/${encodeURIComponent(id)}`;
  const REFRESH_MS = 60_000;

  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  let sessions = [], generatedAt = null, isSample = false;
  let showArchived = store.get("showArchived") === "1";

  // Map Claude's status buckets onto the three lanes.
  const BUCKETS = {
    SESSION_STATUS_BUCKET_BLOCKED:      { lane: "attention", label: "Waiting on you" },
    SESSION_STATUS_BUCKET_REVIEW_READY: { lane: "attention", label: "Ready for review" },
    SESSION_STATUS_BUCKET_FAILED:       { lane: "attention", label: "Errored", failed: true },
    SESSION_STATUS_BUCKET_WORKING:      { lane: "running",   label: "Working" },
    SESSION_STATUS_BUCKET_COMPLETED:    { lane: "dormant",   label: "Done" },
  };
  function classify(s) {
    const archived = s.session_status === "SESSION_STATUS_ARCHIVED";
    const b = BUCKETS[s.status_bucket] || { lane: "dormant", label: "Idle" };
    if (archived) return { lane: "dormant", label: "Archived", archived: true };
    return b;
  }

  function ago(iso) {
    if (!iso) return "";
    const sec = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (sec < 60) return "just now";
    const m = sec / 60; if (m < 60) return `${Math.round(m)}m ago`;
    const h = m / 60; if (h < 24) return `${Math.round(h)}h ago`;
    const d = h / 24; if (d < 30) return `${Math.round(d)}d ago`;
    return new Date(iso).toLocaleDateString();
  }

  const ICON_OPEN = '<svg class="open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';
  const ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  const ICON_CLOUD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 18a4 4 0 0 1-.5-8 6 6 0 0 1 11.5 1.5A3.5 3.5 0 0 1 17.5 18z"/></svg>';
  const ICON_LAPTOP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>';

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function card(s) {
    const c = classify(s);
    const a = el("a", `card ${c.lane}${c.failed ? " failed" : ""}${c.archived ? " archived" : ""}`);
    a.href = SESSION_URL(s.id);
    a.target = "_blank";
    a.rel = "noopener";

    const top = el("div", "top");
    top.append(el("div", "title", s.title || "Untitled session"));
    top.insertAdjacentHTML("beforeend", ICON_OPEN);
    a.append(top);

    if (s.unread) { const u = el("span", "unread"); u.title = "Unread"; a.append(u); }

    const pill = el("span", "pill");
    pill.append(el("span", "dot"), document.createTextNode(c.label));
    a.append(pill);

    const pts = s.post_turn_summary || {};
    if (pts.needs_action && c.lane === "attention") a.append(el("div", "note ask", pts.needs_action));
    else if (pts.recent_action) a.append(el("div", "note", pts.recent_action));
    else if (pts.needs_action) a.append(el("div", "note", pts.needs_action));

    const meta = el("div", "meta");
    const t = el("span"); t.innerHTML = ICON_CLOCK; t.append(ago(s.updated_at)); t.title = new Date(s.updated_at).toLocaleString();
    const where = el("span");
    const local = s.environment_kind === "bridge";
    where.innerHTML = local ? ICON_LAPTOP : ICON_CLOUD;
    where.append(local ? "Your computer" : "Cloud");
    meta.append(t, where);
    a.append(meta);
    return a;
  }

  function render() {
    const q = $("q").value.trim().toLowerCase();
    const lanes = { attention: [], running: [], dormant: [] };
    for (const s of sessions) {
      const c = classify(s);
      if (c.archived && !showArchived) continue;
      if (q) {
        const pts = s.post_turn_summary || {};
        const hay = [s.title, pts.needs_action, pts.recent_action].join(" ").toLowerCase();
        if (!hay.includes(q)) continue;
      }
      lanes[c.lane].push(s);
    }
    for (const [lane, list] of Object.entries(lanes)) {
      list.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
      const g = $(`g-${lane}`);
      g.replaceChildren(...(list.length ? list.map(card) : [el("div", "empty", {
        attention: "Nothing needs you right now.",
        running: "No sessions are running.",
        dormant: "No dormant sessions.",
      }[lane])]));
      $(`c-${lane}`).textContent = list.length;
      $(`n-${lane}`).textContent = list.length;
    }
    $("updated").textContent = generatedAt ? `Snapshot ${ago(generatedAt)} · ${new Date(generatedAt).toLocaleString()}` : "";
    document.title = lanes.attention.length ? `(${lanes.attention.length}) Agent Monitor` : "Agent Monitor";
  }

  function banner(msg, err) {
    const b = $("banner");
    b.textContent = msg || "";
    b.className = "banner" + (msg ? " show" : "") + (err ? " err" : "");
  }

  async function fetchJson(url) {
    const r = await fetch(`${url}?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
    return r.json();
  }

  async function load() {
    let data;
    try {
      data = await fetchJson(DATA_URL);
      isSample = false;
    } catch {
      try { data = await fetchJson(SAMPLE_URL); isSample = true; }
      catch (e) { banner(`Couldn't load session data (${e.message}).`, true); return; }
    }
    // Accepts {generated_at, sessions:[...]}, or a raw list_sessions result ({data:[...]} / {ccr:{data:[...]}}).
    sessions = data.sessions || data.data || (data.ccr && data.ccr.data) || (Array.isArray(data) ? data : []);
    generatedAt = data.generated_at || null;
    banner(isSample ? "Showing sample data. Add a sessions.json next to this page to see your real sessions." : "");
    render();
  }

  // Controls
  $("q").addEventListener("input", render);
  const archBtn = $("archived");
  archBtn.setAttribute("aria-pressed", String(showArchived));
  archBtn.addEventListener("click", () => {
    showArchived = !showArchived;
    store.set("showArchived", showArchived ? "1" : "0");
    archBtn.setAttribute("aria-pressed", String(showArchived));
    render();
  });
  const savedTheme = store.get("theme");
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  $("theme").addEventListener("click", () => {
    const cur = document.documentElement.dataset.theme
      || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    store.set("theme", next);
  });
  document.querySelectorAll("[data-jump]").forEach(b =>
    b.addEventListener("click", () => $(b.dataset.jump).scrollIntoView({ behavior: "smooth" })));

  load();
  setInterval(load, REFRESH_MS);
  setInterval(render, 30_000); // keep the relative times fresh
})();
</script>
</body>
</html>
